name: Validate public developer starters

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  nextjs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs/starter
    env:
      EARTHID_ISSUER: https://issuer.example.org/oidc
      EARTHID_CLIENT_ID: ci-placeholder-client
      EARTHID_CLIENT_SECRET: ci-nonproduction-placeholder
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nonproduction-secret-with-32-or-more-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  aspnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aspnet/starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php/starter
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, openssl
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: find ../../php -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/smoke.php
