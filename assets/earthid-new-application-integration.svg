<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1600 950"><title>EarthID Enterprise new application integration flow</title><defs><marker id="arrow" markerWidth="10" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087a3b"/></marker></defs><rect width="1600" height="950" fill="white"/><text x="45" y="72" font-size="46" font-weight="800" fill="#142749">EarthID Enterprise — New Application Integration</text><text x="45" y="113" font-size="24" fill="#516278">Authentication → account policy → application authorization</text><rect x="45" y="154" width="470" height="169" rx="16" fill="#e8f6ed" stroke="#b5cbd9" stroke-width="2"/><text x="65" y="191" font-size="23" font-weight="700" fill="#142749">1. EarthID Enterprise</text><text x="65" y="229" font-size="19" fill="#253a52">OIDC authentication</text><text x="65" y="260" font-size="19" fill="#253a52">Authorization Code + PKCE</text><text x="65" y="291" font-size="19" fill="#253a52">Verified identity: issuer + sub</text><rect x="563" y="154" width="470" height="169" rx="16" fill="#eaf5ff" stroke="#b5cbd9" stroke-width="2"/><text x="583" y="191" font-size="23" font-weight="700" fill="#142749">2. New Application</text><text x="583" y="229" font-size="19" fill="#253a52">Validate OIDC callback</text><text x="583" y="260" font-size="19" fill="#253a52">Decide first-time access policy</text><text x="583" y="291" font-size="19" fill="#253a52">Establish approved app session</text><rect x="1081" y="154" width="470" height="169" rx="16" fill="#e8f6ed" stroke="#b5cbd9" stroke-width="2"/><text x="1101" y="191" font-size="23" font-weight="700" fill="#142749">3. Protected API</text><text x="1101" y="229" font-size="19" fill="#253a52">Enforce local role + status</text><text x="1101" y="260" font-size="19" fill="#253a52">Check record ownership</text><text x="1101" y="291" font-size="19" fill="#253a52">Deny by default</text><path d="M517 235 L555 235" stroke="#087a3b" stroke-width="4" marker-end="url(#arrow)"/><path d="M1035 235 L1073 235" stroke="#087a3b" stroke-width="4" marker-end="url(#arrow)"/><text x="45" y="403" font-size="29" font-weight="800" fill="#142749">First-time account policy</text><rect x="45" y="437" width="470" height="250" rx="16" fill="#e8f6ed" stroke="#b5cbd9" stroke-width="2"/><text x="65" y="474" font-size="23" font-weight="700" fill="#142749">PUBLIC APPLICANT</text><text x="65" y="512" font-size="19" fill="#253a52">JIT profile if policy approves</text><text x="65" y="543" font-size="19" fill="#253a52">Least-privilege applicant only</text><text x="65" y="574" font-size="19" fill="#253a52">No second app password</text><text x="65" y="605" font-size="19" fill="#253a52">Own-record access only</text><rect x="563" y="437" width="470" height="250" rx="16" fill="#eaf3ff" stroke="#b5cbd9" stroke-width="2"/><text x="583" y="474" font-size="23" font-weight="700" fill="#142749">STAFF / ADMIN</text><text x="583" y="512" font-size="19" fill="#253a52">Pre-approved invitation or role</text><text x="583" y="543" font-size="19" fill="#253a52">Never automatically promote</text><text x="583" y="574" font-size="19" fill="#253a52">Unrecognized user: deny/pending</text><text x="583" y="605" font-size="19" fill="#253a52">Business access enforced by API</text><rect x="1081" y="437" width="470" height="250" rx="16" fill="#f4f6f9" stroke="#b5cbd9" stroke-width="2"/><text x="1101" y="474" font-size="23" font-weight="700" fill="#142749">ACCOUNTLESS IDENTITY</text><text x="1101" y="512" font-size="19" fill="#253a52">No app account where unnecessary</text><text x="1101" y="543" font-size="19" fill="#253a52">MyKad verification: separate API</text><text x="1101" y="574" font-size="19" fill="#253a52">No implied resource entitlement</text><text x="1101" y="605" font-size="19" fill="#253a52">Bind proof to one transaction</text><rect x="45" y="720" width="1506" height="105" rx="16" fill="#eaf3ff" stroke="#b5cbd9" stroke-width="2"/><text x="72" y="760" font-size="25" font-weight="700" fill="#1958a0">Authorization always belongs to the application / protected API</text><text x="72" y="798" font-size="21" fill="#253a52">Local user ID (if required)  •  Status  •  Roles  •  Resource ownership  •  Audit</text><text x="800" y="901" font-size="18" text-anchor="middle" fill="#516278">Public documentation example — actual issuer and Client ID are supplied by the implementing organization</text></svg>