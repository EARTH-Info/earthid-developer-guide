<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 1050"><title id="title">Linked EarthID Account Flow for Existing Applications</title><desc id="desc">Secure OIDC association flow with account linking, local mapping and security checks for re-association and unlink.</desc><defs><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#175fa8"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#0b8a3c"/></marker></defs><rect width="1600" height="1050" fill="#fff"/><rect x="42" y="38" width="9" height="66" rx="3" fill="#0b8a3c" stroke="#0b8a3c" stroke-width="1.5"/><text x="72" y="88" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="800" text-anchor="start">Linked EarthID Account Flow for Existing Applications</text><text x="74" y="126" fill="#516278" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Associate, Re-associate and Unlink — safely</text><rect x="42" y="152" width="1516" height="458" rx="14" fill="#fff" stroke="#cad8e8" stroke-width="1.5"/><text x="67" y="188" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">First-time association — secure OIDC linking, not account creation</text><rect x="52.5" y="210" width="265" height="74" rx="14" fill="#eaf7ed" stroke="#a3d1b2" stroke-width="1.5"/><text x="185" y="254" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">User</text><line x1="185" y1="284" x2="185" y2="595" stroke="#bdcbd9" stroke-width="2" stroke-dasharray="5 8"/><rect x="438" y="210" width="272" height="74" rx="14" fill="#e9f3ff" stroke="#b0cfee" stroke-width="1.5"/><text x="574" y="254" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Existing Application</text><line x1="574" y1="284" x2="574" y2="595" stroke="#bdcbd9" stroke-width="2" stroke-dasharray="5 8"/><rect x="848.5" y="210" width="275" height="74" rx="14" fill="#eaf7ed" stroke="#a3d1b2" stroke-width="1.5"/><text x="986" y="254" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">EarthID Enterprise</text><line x1="986" y1="284" x2="986" y2="595" stroke="#bdcbd9" stroke-width="2" stroke-dasharray="5 8"/><rect x="1227.5" y="210" width="303" height="74" rx="14" fill="#e9f3ff" stroke="#b0cfee" stroke-width="1.5"/><text x="1379" y="254" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Local Users + Mapping</text><line x1="1379" y1="284" x2="1379" y2="595" stroke="#bdcbd9" stroke-width="2" stroke-dasharray="5 8"/><path d="M185 337 L574 337" fill="none" stroke="#175fa8" stroke-width="3" marker-end="url(#arrow-blue)"/><circle cx="229.5" cy="315" r="14" fill="#0b8a3c"/><text x="229.5" y="320" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="253.5" y="320" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Open Profile / choose Associate</text><path d="M574 399 L986 399" fill="none" stroke="#175fa8" stroke-width="3" marker-end="url(#arrow-blue)"/><circle cx="630" cy="377" r="14" fill="#0b8a3c"/><text x="630" y="382" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">2</text><text x="654" y="382" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Start OIDC: state + nonce + PKCE</text><path d="M986 461 L574 461" fill="none" stroke="#175fa8" stroke-width="3" marker-end="url(#arrow-blue)"/><circle cx="630" cy="439" r="14" fill="#0b8a3c"/><text x="630" y="444" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">3</text><text x="654" y="444" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Authorization code + validation</text><path d="M574 525 L1379 525" fill="none" stroke="#175fa8" stroke-width="3" marker-end="url(#arrow-blue)"/><circle cx="826.5" cy="503" r="14" fill="#0b8a3c"/><text x="826.5" y="508" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">4</text><text x="850.5" y="508" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Check uniqueness and store mapping</text><path d="M574 576 L185 576" fill="none" stroke="#0b8a3c" stroke-width="3" marker-end="url(#arrow-green)"/><circle cx="347" cy="553" r="14" fill="#0b8a3c"/><text x="347" y="558" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">5</text><text x="367" y="558" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Profile shows Linked status</text><text x="67" y="596" fill="#516278" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Local account control and authorization remain with the application.</text><rect x="42" y="632" width="760" height="319" rx="14" fill="#fff" stroke="#cad8e8" stroke-width="1.5"/><rect x="822" y="632" width="736" height="319" rx="14" fill="#fff" stroke="#cad8e8" stroke-width="1.5"/><rect x="55" y="643" width="734" height="56" rx="14" fill="#e9f3ff" stroke="#e9f3ff" stroke-width="1.5"/><text x="77" y="682" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">Security Gates Before Any Link Change</text><rect x="63" y="694" width="363" height="45" rx="9" fill="#eaf7ed" stroke="#eaf7ed" stroke-width="1.5"/><text x="78" y="723" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">External identity linked elsewhere?</text><text x="433" y="722" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="start">→</text><rect x="470" y="694" width="309" height="45" rx="9" fill="#e9f3ff" stroke="#e9f3ff" stroke-width="1.5"/><text x="481" y="723" fill="#a23b24" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Reject + request admin review</text><rect x="63" y="751" width="363" height="45" rx="9" fill="#eaf7ed" stroke="#eaf7ed" stroke-width="1.5"/><text x="78" y="780" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Local account ownership proven?</text><text x="433" y="779" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="start">→</text><rect x="470" y="751" width="309" height="45" rx="9" fill="#e9f3ff" stroke="#e9f3ff" stroke-width="1.5"/><text x="481" y="780" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">If no, stop</text><rect x="63" y="808" width="363" height="45" rx="9" fill="#eaf7ed" stroke="#eaf7ed" stroke-width="1.5"/><text x="78" y="837" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Only approved sign-in method?</text><text x="433" y="836" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="start">→</text><rect x="470" y="808" width="309" height="45" rx="9" fill="#e9f3ff" stroke="#e9f3ff" stroke-width="1.5"/><text x="481" y="837" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Disable self-service Unlink</text><rect x="63" y="865" width="363" height="45" rx="9" fill="#eaf7ed" stroke="#eaf7ed" stroke-width="1.5"/><text x="78" y="894" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Privileged local user?</text><text x="433" y="893" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="start">→</text><rect x="470" y="865" width="309" height="45" rx="9" fill="#e9f3ff" stroke="#e9f3ff" stroke-width="1.5"/><text x="481" y="894" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Step-up / admin approval</text><rect x="834" y="643" width="712" height="56" rx="14" fill="#eaf7ed" stroke="#eaf7ed" stroke-width="1.5"/><text x="858" y="682" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">User Profile — Link Status</text><rect x="851" y="711" width="674" height="160" rx="12" fill="#fff" stroke="#b6cedd" stroke-width="1.5"/><text x="879" y="750" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">Linked EarthID Account</text><text x="880" y="783" fill="#516278" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Status</text><rect x="971" y="763" width="115" height="36" rx="16" fill="#eaf7ed" stroke="#eaf7ed" stroke-width="1.5"/><text x="1028.5" y="787" fill="#0b8a3c" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Linked</text><text x="880" y="827" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Identity: e***@organization-domain.com</text><rect x="891" y="843" width="168" height="36" rx="16" fill="#e9f3ff" stroke="#e9f3ff" stroke-width="1.5"/><text x="975" y="867" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Re-associate</text><rect x="1071" y="843" width="265" height="36" rx="16" fill="#f1f3f5" stroke="#f1f3f5" stroke-width="1.5"/><text x="1203.5" y="867" fill="#516278" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Unlink (policy-controlled)</text><text x="862" y="911" fill="#0b8a3c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Re-associate validates the NEW identity before replacement.</text><text x="862" y="936" fill="#516278" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Unlink never deletes local roles, records or account history.</text><rect x="42" y="971" width="1516" height="56" rx="14" fill="#eaf7ed" stroke="#b7d8c1" stroke-width="1.5"/><text x="78" y="1006" fill="#0b8a3c" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" text-anchor="start">BEST PRACTICE</text><text x="310" y="1006" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">EarthID authenticates   •   App authorizes   •   Audit every link change   •   Never create account lockout</text></svg>