<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 1050"><title id="title">EarthID Enterprise for Existing Applications</title><desc id="desc">Authentication by EarthID, authorization by the vendor application, recommended legacy app flow and linked identity UX.</desc><defs><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#175fa8"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#0b8a3c"/></marker></defs><rect width="1600" height="1050" fill="#fff"/><rect x="43" y="38" width="9" height="66" rx="3" fill="#0b8a3c" stroke="#0b8a3c" stroke-width="1.5"/><text x="73" y="87" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="800" text-anchor="start">EarthID Enterprise for Existing Applications</text><text x="74" y="120" fill="#516278" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Authentication by EarthID Enterprise. Authorization by Your Application.</text><rect x="42" y="151" width="1516" height="74" rx="14" fill="#eaf7ed" stroke="#b7d8c1" stroke-width="1.5"/><text x="80" y="197" fill="#0b8a3c" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">Single sign-on for legacy and existing applications</text><rect x="930" y="170" width="168" height="36" rx="17" fill="#e9f3ff" stroke="#e9f3ff" stroke-width="1.5"/><text x="1014" y="194" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">OIDC / SSO</text><rect x="1110" y="170" width="213" height="36" rx="17" fill="#eaf7ed" stroke="#eaf7ed" stroke-width="1.5"/><text x="1216.5" y="194" fill="#0b8a3c" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Local User Mapping</text><rect x="1335" y="170" width="192" height="36" rx="17" fill="#e9f3ff" stroke="#e9f3ff" stroke-width="1.5"/><text x="1431" y="194" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Business Access</text><rect x="42" y="244" width="1516" height="275" rx="14" fill="#fff" stroke="#cad8e8" stroke-width="1.5"/><rect x="52" y="254" width="732" height="52" rx="14" fill="#eaf7ed" stroke="#eaf7ed" stroke-width="1.5"/><rect x="802" y="254" width="745" height="52" rx="14" fill="#e9f3ff" stroke="#e9f3ff" stroke-width="1.5"/><text x="77" y="289" fill="#0b8a3c" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start">EarthID Enterprise — Authentication (AuthN)</text><text x="827" y="289" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start">Your Application — Authorization (AuthZ)</text><line x1="795" y1="259" x2="795" y2="459" stroke="#b7c7d7" stroke-width="2" /><circle cx="77" cy="339" r="5" fill="#0b8a3c"/><text x="96" y="346" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Verifies who the user is</text><circle cx="827" cy="339" r="5" fill="#175fa8"/><text x="846" y="346" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Resolves the linked local user account</text><circle cx="77" cy="375" r="5" fill="#0b8a3c"/><text x="96" y="382" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Authenticates through the organization's IdP</text><circle cx="827" cy="375" r="5" fill="#175fa8"/><text x="846" y="382" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Applies business roles and permissions</text><circle cx="77" cy="411" r="5" fill="#0b8a3c"/><text x="96" y="418" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Returns validated identity: issuer + sub</text><circle cx="827" cy="411" r="5" fill="#175fa8"/><text x="846" y="418" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Checks active / disabled account status</text><circle cx="77" cy="447" r="5" fill="#0b8a3c"/><text x="96" y="454" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Enables SSO across connected applications</text><circle cx="827" cy="447" r="5" fill="#175fa8"/><text x="846" y="454" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Enforces record-level access and business rules</text><rect x="58" y="468" width="1481" height="37" rx="9" fill="#e9f3ff" stroke="#e9f3ff" stroke-width="1.5"/><text x="800" y="493" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Successful authentication does not automatically grant business access.</text><rect x="42" y="538" width="1516" height="190" rx="14" fill="#fff" stroke="#cad8e8" stroke-width="1.5"/><text x="68" y="575" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="800" text-anchor="start">Recommended Legacy Application Flow</text><rect x="66" y="599" width="326" height="66" rx="14" fill="#eaf7ed" stroke="#9bcba8" stroke-width="1.5"/><text x="229" y="628" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">1  Sign in with</text><text x="229" y="649" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">EarthID Enterprise</text><path d="M401 631 L450 631" fill="none" stroke="#0b8a3c" stroke-width="3" marker-end="url(#arrow-green)"/><rect x="457" y="599" width="326" height="66" rx="14" fill="#eaf7ed" stroke="#9bcba8" stroke-width="1.5"/><text x="620" y="628" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">2  Resolve linked</text><text x="620" y="649" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">local user account</text><path d="M792 631 L841 631" fill="none" stroke="#0b8a3c" stroke-width="3" marker-end="url(#arrow-green)"/><rect x="848" y="599" width="326" height="66" rx="14" fill="#eaf7ed" stroke="#9bcba8" stroke-width="1.5"/><text x="1011" y="628" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">3  Create local</text><text x="1011" y="649" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">application session</text><path d="M1183 631 L1232 631" fill="none" stroke="#0b8a3c" stroke-width="3" marker-end="url(#arrow-green)"/><rect x="1239" y="599" width="326" height="66" rx="14" fill="#eaf7ed" stroke="#9bcba8" stroke-width="1.5"/><text x="1402" y="628" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">4  Enforce roles</text><text x="1402" y="649" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">and business access</text><rect x="65" y="677" width="1472" height="36" rx="9" fill="#eaf7ed" stroke="#eaf7ed" stroke-width="1.5"/><text x="801" y="702" fill="#0b8a3c" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Returning linked users do not need a second routine password prompt.</text><rect x="42" y="743" width="750" height="251" rx="14" fill="#fff" stroke="#cad8e8" stroke-width="1.5"/><rect x="813" y="743" width="745" height="251" rx="14" fill="#fff" stroke="#cad8e8" stroke-width="1.5"/><text x="68" y="781" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">Linked Account Profile — Best Practice</text><rect x="66" y="798" width="705" height="154" rx="10" fill="#e9f3ff" stroke="#bfdaee" stroke-width="1.5"/><text x="89" y="833" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Linked EarthID Account</text><text x="90" y="865" fill="#516278" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Status:</text><rect x="189" y="839" width="115" height="36" rx="17" fill="#eaf7ed" stroke="#eaf7ed" stroke-width="1.5"/><text x="246.5" y="863" fill="#0b8a3c" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Linked</text><text x="90" y="902" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Provider: EarthID Enterprise</text><text x="90" y="932" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Linked identity: e***@organization-domain.com</text><rect x="471" y="841" width="155" height="36" rx="17" fill="#e9f3ff" stroke="#e9f3ff" stroke-width="1.5"/><text x="548.5" y="865" fill="#175fa8" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Re-associate</text><rect x="638" y="841" width="102" height="36" rx="17" fill="#f1f3f5" stroke="#f1f3f5" stroke-width="1.5"/><text x="689" y="865" fill="#516278" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Unlink</text><text x="65" y="974" fill="#8b5a02" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Unlink only when approved alternative sign-in or recovery exists.</text><text x="841" y="781" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">Security Best Practices</text><circle cx="855" cy="818" r="11" fill="#0b8a3c"/><text x="855" y="823" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">✓</text><text x="884" y="825" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Authorization Code + PKCE for all web clients</text><circle cx="855" cy="852" r="11" fill="#0b8a3c"/><text x="855" y="857" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">✓</text><text x="884" y="859" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Store unique (issuer, sub) → local_user_id mapping</text><circle cx="855" cy="886" r="11" fill="#0b8a3c"/><text x="855" y="891" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">✓</text><text x="884" y="893" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Require controlled first-time linking</text><circle cx="855" cy="920" r="11" fill="#0b8a3c"/><text x="855" y="925" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">✓</text><text x="884" y="927" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Audit associate, re-associate and unlink actions</text><circle cx="855" cy="954" r="11" fill="#0b8a3c"/><text x="855" y="959" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">✓</text><text x="884" y="961" fill="#14274c" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Enforce permissions in your backend / API</text><line x1="42" y1="1020" x2="1558" y2="1020" stroke="#0b8a3c" stroke-width="2" /><text x="800" y="1041" fill="#516278" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Public developer guide illustration — fictional example only</text></svg>